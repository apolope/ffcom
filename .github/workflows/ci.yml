name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-central:
    name: server-central (vet + test)
    runs-on: [self-hosted, a3s-network]
    # Postgres descartável para os testes de integração (openTestStore): o
    # runner cria o container antes dos passos e o remove no fim, mesmo se o
    # job falhar ou for cancelado. Porta do host aleatória, porque os três
    # runners do SVRUBS24IPS0101 rodam jobs em paralelo.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ffcom_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ffcom_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server-central/go.mod
      - name: go vet
        working-directory: server-central
        run: go vet ./...
      - name: go test
        working-directory: server-central
        env:
          FFCOM_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/ffcom_test?sslmode=disable
        run: go test ./...
      - name: licenças de terceiros atualizadas
        run: |
          bash scripts/go-third-party-notices.sh server-central .
          git diff --exit-code -- 'server-central/**THIRD_PARTY_NOTICES.txt' || {
            echo "::error::THIRD_PARTY_NOTICES.txt desatualizado; rode o scripts/go-third-party-notices.sh acima e faça commit do resultado"
            exit 1
          }

  test-channel:
    name: server-channel (vet + test)
    runs-on: [self-hosted, a3s-network]
    # Postgres descartável para os testes de integração (openTestStore): o
    # runner cria o container antes dos passos e o remove no fim, mesmo se o
    # job falhar ou for cancelado. Porta do host aleatória, porque os três
    # runners do SVRUBS24IPS0101 rodam jobs em paralelo.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ffcom_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ffcom_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server-channel/go.mod
      - name: go vet
        working-directory: server-channel
        run: go vet ./...
      - name: go test
        working-directory: server-channel
        env:
          FFCOM_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/ffcom_test?sslmode=disable
        run: go test ./...
      - name: licenças de terceiros atualizadas
        run: |
          bash scripts/go-third-party-notices.sh server-channel .
          bash scripts/go-third-party-notices.sh server-channel ./cmd/ffcom-runtime
          git diff --exit-code -- 'server-channel/**THIRD_PARTY_NOTICES.txt' || {
            echo "::error::THIRD_PARTY_NOTICES.txt desatualizado; rode o scripts/go-third-party-notices.sh acima e faça commit do resultado"
            exit 1
          }

  lint-build-client:
    name: client (lint + build)
    runs-on: [self-hosted, a3s-network]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm ci
        working-directory: client
        run: npm ci
      - name: npm run lint
        working-directory: client
        run: npm run lint
      - name: npm run build
        working-directory: client
        run: npm run build
