name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-central:
    name: server-central (vet + test)
    runs-on: [self-hosted, a3s-network]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server-central/go.mod
      - name: go vet
        working-directory: server-central
        run: go vet ./...
      - name: go test
        working-directory: server-central
        run: go test ./...
      - name: licenças de terceiros atualizadas
        run: |
          bash scripts/go-third-party-notices.sh server-central .
          git diff --exit-code -- 'server-central/**THIRD_PARTY_NOTICES.txt' || {
            echo "::error::THIRD_PARTY_NOTICES.txt desatualizado; rode o scripts/go-third-party-notices.sh acima e faça commit do resultado"
            exit 1
          }

  test-channel:
    name: server-channel (vet + test)
    runs-on: [self-hosted, a3s-network]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server-channel/go.mod
      - name: go vet
        working-directory: server-channel
        run: go vet ./...
      - name: go test
        working-directory: server-channel
        run: go test ./...
      - name: licenças de terceiros atualizadas
        run: |
          bash scripts/go-third-party-notices.sh server-channel .
          bash scripts/go-third-party-notices.sh server-channel ./cmd/ffcom-runtime
          git diff --exit-code -- 'server-channel/**THIRD_PARTY_NOTICES.txt' || {
            echo "::error::THIRD_PARTY_NOTICES.txt desatualizado; rode o scripts/go-third-party-notices.sh acima e faça commit do resultado"
            exit 1
          }

  lint-build-client:
    name: client (lint + build)
    runs-on: [self-hosted, a3s-network]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm ci
        working-directory: client
        run: npm ci
      - name: npm run lint
        working-directory: client
        run: npm run lint
      - name: npm run build
        working-directory: client
        run: npm run build
