name: deploy-ffcom-channel

# Release do serviço server-channel no modelo do container evergreen (ver
# docs/architecture.md, "Decisão: container evergreen em `server-channel`").
# A tag channel-vX.Y.Z não gera mais imagem: gera os binários linux/amd64 e
# linux/arm64 no release channel-vX.Y.Z e estende o índice assinado
# (index.json + index.json.sig) do release fixo channel-stable, que o
# lançador ffcom-runtime consulta. A imagem passa a ter workflow próprio
# (tags channel-image-v*, Fase 3); por isso o hadolint do Dockerfile saiu
# daqui.
#
# Sem workflow_dispatch: a versão vem da tag, e rodar sem tag não tem versão
# para publicar. Para republicar uma versão, apague e recrie a tag (index add
# substitui a entrada de mesma versão).

on:
  push:
    tags:
      - 'channel-v*'

permissions:
  contents: read

# Duas tags publicadas ao mesmo tempo baixariam o mesmo índice e uma
# apagaria a versão da outra. Serializa a publicação sem cancelar a fila.
concurrency:
  group: channel-stable-index
  cancel-in-progress: false

env:
  INDEX_URL: https://github.com/apolope/ffcom/releases/download/channel-stable
  RELEASE_PUB: server-channel/cmd/ffcom-runtime/release.pub

jobs:
  security-scan:
    name: Scan de segredos
    runs-on: [self-hosted, a3s-network]
    steps:
      - uses: actions/checkout@v7
      - name: "Gitleaks (escopo: server-channel)"
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source="/repo/server-channel" --no-git -v

  # Build e testes sem acesso à chave de assinatura: go test executa código
  # do repositório, então fica fora do environment channel-release.
  #
  # Go via actions/setup-go (e não docker run golang:1.27-alpine): o ci.yml
  # já usa setup-go neste mesmo runner, a versão sai de go.mod, e um
  # container com o workspace montado deixaria arquivos de root no checkout
  # do runner self-hosted. O release-tool precisa rodar no host depois, o que
  # também fica mais simples com o Go nativo.
  changelog:
    name: Entrada no CHANGELOG
    runs-on: [self-hosted, a3s-network]
    steps:
      - uses: actions/checkout@v7
      - name: Conferir CHANGELOG.md
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/check-changelog.sh "$TAG"

  build:
    name: Build dos binários
    needs: [security-scan, changelog]
    runs-on: [self-hosted, a3s-network]
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Determinar versão
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^channel-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag '$TAG' fora do formato channel-vX.Y.Z"
            exit 1
          fi
          # Sem o "v": é o mesmo texto do índice e do /healthz, que o
          # lançador compara depois da troca.
          echo "value=${TAG#channel-v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: server-channel/go.mod

      - name: go vet e go test
        working-directory: server-channel
        run: |
          go vet ./...
          go test ./...

      - name: Build linux/amd64 e linux/arm64
        working-directory: server-channel
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/server-channel-linux-${arch}" .
          done
          sha256sum dist/server-channel-linux-*

      - uses: actions/upload-artifact@v7
        with:
          name: server-channel-binaries
          path: server-channel/dist/server-channel-linux-*
          if-no-files-found: error
          retention-days: 7

  # Único job com a chave privada: environment channel-release, com
  # aprovação manual configurada no GitHub.
  publish:
    name: Publicar release e índice assinado
    needs: [build]
    runs-on: [self-hosted, a3s-network]
    environment: channel-release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Chave pública presente
        run: |
          # Nasce na Fase 2 (ffcom-runtime a embute via go:embed). Sem ela
          # não há como verificar o índice atual nem conferir que o secret
          # assina com o par certo.
          if [ ! -s "$RELEASE_PUB" ]; then
            echo "Falta $RELEASE_PUB (ver comentário no topo de server-channel/cmd/release-tool/main.go)"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: server-channel/go.mod

      - name: Build do release-tool
        working-directory: server-channel
        run: go build -o "$RUNNER_TEMP/release-tool" ./cmd/release-tool

      - uses: actions/download-artifact@v8
        with:
          name: server-channel-binaries
          path: dist

      # Descrição da release = entrada da versão no CHANGELOG.md, o mesmo
      # texto da home page (scripts/changelog-notes.sh).
      - name: Notas da versão
        run: bash scripts/changelog-notes.sh "channel-v${VERSION}" > "$RUNNER_TEMP/release-notes.md"

      - name: Criar release channel-v${{ env.VERSION }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: channel-v${{ env.VERSION }}
          name: server-channel ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/server-channel-linux-amd64
            dist/server-channel-linux-arm64
          fail_on_unmatched_files: true
          make_latest: false

      # Baixa o índice atual pela URL pública (a mesma que o lançador usa).
      # 404 = primeiro release, começa vazio. Qualquer outro erro falha, para
      # não sobrescrever um índice existente por uma falha de rede.
      - name: Baixar índice atual
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('index', { recursive: true });
            let found = 0;
            for (const name of ['index.json', 'index.json.sig']) {
              const res = await fetch(`${process.env.INDEX_URL}/${name}`, { cache: 'no-store' });
              if (res.status === 404) {
                core.info(`${name}: 404`);
                continue;
              }
              if (!res.ok) throw new Error(`${name}: HTTP ${res.status}`);
              fs.writeFileSync(`index/${name}`, Buffer.from(await res.arrayBuffer()));
              found++;
            }
            if (found === 1) throw new Error('channel-stable tem só um de index.json/index.json.sig; corrija à mão antes de publicar');
            core.info(found === 2 ? 'índice existente baixado' : 'sem índice, começando vazio');

      - name: Verificar índice atual
        run: |
          if [ -f index/index.json ]; then
            "$RUNNER_TEMP/release-tool" verify -index index/index.json -sig index/index.json.sig -pub "$RELEASE_PUB"
          fi

      - name: Adicionar versão e assinar
        env:
          CHANNEL_RELEASE_SIGNING_KEY: ${{ secrets.CHANNEL_RELEASE_SIGNING_KEY }}
        run: |
          MIN_RUNTIME="$(tr -d '[:space:]' < server-channel/MIN_RUNTIME)"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/channel-v${VERSION}"
          "$RUNNER_TEMP/release-tool" index add -index index/index.json \
            -version "$VERSION" -min-runtime "$MIN_RUNTIME" \
            -artifact "linux/amd64=${BASE}/server-channel-linux-amd64=dist/server-channel-linux-amd64" \
            -artifact "linux/arm64=${BASE}/server-channel-linux-arm64=dist/server-channel-linux-arm64"
          "$RUNNER_TEMP/release-tool" sign -index index/index.json \
            -key-env CHANNEL_RELEASE_SIGNING_KEY -out index/index.json.sig
          # Confere que o secret é o par da pública do repo antes de publicar.
          "$RUNNER_TEMP/release-tool" verify -index index/index.json -sig index/index.json.sig -pub "$RELEASE_PUB"
          cat index/index.json

      # Release fixo channel-stable: prerelease e make_latest=false para não
      # virar o "latest" do repo. Os assets sobem com nome temporário e só
      # depois substituem os antigos, para a janela sem índice (ou com índice
      # e assinatura de gerações diferentes) ser de poucos segundos; nessa
      # janela o lançador só falha a checagem e tenta de novo no próximo
      # intervalo.
      - name: Publicar índice em channel-stable
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = 'channel-stable';
            let rel;
            try {
              rel = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (e) {
              if (e.status !== 404) throw e;
              rel = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: 'server-channel: índice de versões',
                body: 'Índice assinado (index.json + index.json.sig) consultado pelo lançador ffcom-runtime. Não é uma versão; ver docs/architecture.md, "Decisão: container evergreen em `server-channel`".',
                prerelease: true, make_latest: 'false',
              })).data;
            }

            const finals = ['index.json', 'index.json.sig'];
            const suffix = `.new-${context.runId}`;
            const uploaded = {};
            for (const name of finals) {
              const data = fs.readFileSync(`index/${name}`);
              const res = await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: rel.id, name: name + suffix, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length },
              });
              uploaded[name] = res.data.id;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: rel.id, per_page: 100 });
            for (const a of assets) {
              const stale = finals.includes(a.name) || (/\.new-\d+$/.test(a.name) && !a.name.endsWith(suffix));
              if (stale) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
            }
            for (const name of finals) {
              await github.rest.repos.updateReleaseAsset({ owner, repo, asset_id: uploaded[name], name });
            }
            core.info(`índice publicado em ${rel.html_url}`);

  # Canário: a instância de teste (FFCOM_CHANNEL_VERSION=latest em
  # deploy/channel/docker-compose.yml) troca para a versão recém publicada
  # sem recriar o container: SIGHUP faz o lançador checar o índice na hora
  # (ver docs/architecture.md, "Decisão: container evergreen em
  # `server-channel`", item 10). Se a versão não subir no prazo, o job falha
  # com os logs do lançador, para a release ruim aparecer aqui antes de
  # chegar em quem autohospeda (que checa de hora em hora).
  #
  # O runner roda no próprio SVRUBS24IPS0101, então fala direto com o
  # Docker do host; o container não publica porta, por isso o /healthz é
  # lido de dentro dele (wget do busybox). Sem environment channel-release:
  # este job não precisa da chave.
  canary:
    name: Canário na instância de teste
    needs: [build, publish]
    runs-on: [self-hosted, a3s-network]
    env:
      VERSION: ${{ needs.build.outputs.version }}
      CONTAINER: ffcom-channel-app
    steps:
      - name: SIGHUP e espera pelo /healthz com a versão nova
        run: |
          # Sem -e (o shell padrão do Actions liga): o wget falha durante a
          # troca de versão, e isso não pode derrubar o passo.
          set +e -u

          if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" != "true" ]; then
            echo "::notice::$CONTAINER não existe ou não está rodando; nada a atualizar"
            exit 0
          fi
          # Imagem antiga (binário direto, sem lançador): ainda não migrou
          # para o container evergreen, que chega por channel-image-v*.
          if ! docker inspect -f '{{json .Config.Entrypoint}}' "$CONTAINER" | grep -q ffcom-runtime; then
            echo "::notice::$CONTAINER ainda roda a imagem antiga (sem ffcom-runtime); publique channel-image-v* para migrar"
            exit 0
          fi

          envval() {
            docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$CONTAINER" | sed -n "s/^$1=//p" | tail -n 1
          }
          healthz_version() {
            docker exec "$CONTAINER" sh -c 'wget -qO- -T 5 "http://127.0.0.1:${SERVER_PORT:-8080}/healthz"' 2>/dev/null \
              | sed -n 's/.*"version":"\([^"]*\)".*/\1/p'
          }

          if [ "$(envval FFCOM_AUTO_UPDATE)" = "false" ]; then
            echo "::notice::FFCOM_AUTO_UPDATE=false em $CONTAINER; o lançador só loga a versão nova"
            exit 0
          fi
          # Trilha diferente de latest (ex. versão fixada no .env para segurar
          # uma release ruim): só espera a troca se $VERSION estiver nela.
          # Vazio = minor da semente da imagem (label seed-version).
          TRACK="$(envval FFCOM_CHANNEL_VERSION)"
          if [ -z "$TRACK" ]; then
            SEED="$(docker inspect -f '{{index .Config.Labels "br.com.a3sitsolutions.ffcom.seed-version"}}' "$CONTAINER")"
            TRACK="${SEED%.*}"
          fi
          echo "Trilha de $CONTAINER: $TRACK; versão publicada: $VERSION"
          case "$TRACK" in
            latest|"$VERSION") ;;
            *.*.*)
              echo "::notice::$CONTAINER fixado em $TRACK; $VERSION não entra"
              exit 0 ;;
            *)
              if [[ "$VERSION" != "$TRACK".* ]]; then
                echo "::notice::$VERSION fora da trilha $TRACK de $CONTAINER"
                exit 0
              fi ;;
          esac

          BEFORE="$(healthz_version)"
          echo "Versão atual: ${BEFORE:-desconhecida}"
          if [ "$BEFORE" = "$VERSION" ]; then
            echo "$CONTAINER já está em $VERSION"
            exit 0
          fi

          # SIGHUP de novo a cada 60s: o download do índice pode pegar a
          # janela de troca dos assets de channel-stable ou um cache do CDN
          # do GitHub, e aí o lançador só tentaria no próximo intervalo.
          # Sinais repetidos durante uma troca se fundem numa checagem.
          START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DEADLINE=$(( $(date +%s) + 180 ))
          NEXT_HUP=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if [ "$(date +%s)" -ge "$NEXT_HUP" ]; then
              echo "SIGHUP em $CONTAINER"
              docker kill -s HUP "$CONTAINER" >/dev/null
              NEXT_HUP=$(( $(date +%s) + 60 ))
            fi
            sleep 5
            NOW="$(healthz_version)"
            if [ "$NOW" = "$VERSION" ]; then
              echo "$CONTAINER trocou ${BEFORE:-?} -> $VERSION"
              docker logs --since "$START" "$CONTAINER" 2>&1 | grep 'ffcom-runtime:' || true
              exit 0
            fi
            echo "Aguardando... /healthz em ${NOW:-sem resposta (troca em andamento?)}"
          done

          echo "::error::$CONTAINER não chegou em $VERSION em 3 minutos (continua em ${NOW:-?})"
          echo "--- logs desde o SIGHUP ---"
          docker logs --since "$START" "$CONTAINER" 2>&1 | tail -n 200
          exit 1
