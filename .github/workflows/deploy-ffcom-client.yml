name: deploy-ffcom-client

on:
  workflow_dispatch:
  push:
    tags:
      - 'client-v*'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/apolope/ffcom-client
  # VITE_* é embutido no bundle em tempo de build (ver client/Dockerfile) —
  # precisa ser o domínio público de server-central roteado via NPM, não
  # localhost. Ajustar aqui se o subdomínio mudar.
  VITE_SERVER_CENTRAL_URL: https://central.ffcom.a3sitsolutions.com.br

jobs:
  lint-dockerfile:
    name: Lint do Dockerfile
    runs-on: [self-hosted, a3s-network]
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: client/Dockerfile

  security-scan:
    name: Scan de segredos
    runs-on: [self-hosted, a3s-network]
    steps:
      - uses: actions/checkout@v7
      - name: "Gitleaks (escopo: client)"
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source="/repo/client" --no-git -v

  changelog:
    name: Entrada no CHANGELOG
    runs-on: [self-hosted, a3s-network]
    steps:
      - uses: actions/checkout@v7
      - name: Conferir CHANGELOG.md e CHANGELOG.en.md
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/check-changelog.sh "$TAG"

  locales:
    name: Arquivos de idioma
    runs-on: [self-hosted, a3s-network]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Conferir locales/
        run: node scripts/check-locales.mjs

  build-push-deploy:
    name: Build, push e deploy
    needs: [lint-dockerfile, security-scan, changelog, locales]
    runs-on: [self-hosted, a3s-network]

    steps:
      - uses: actions/checkout@v7

      - name: Login no GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Determinar versão
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/client-v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/client-}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build e push da imagem
        working-directory: client
        run: |
          # Arquivos de idioma ficam na raiz do repositório, fora do contexto
          # do Docker (ver client/Dockerfile e o alias @locales do vite.config.ts).
          rm -rf locales && cp -r ../locales locales
          VERSION="${{ steps.version.outputs.value }}"
          TAGS=(-t "${IMAGE}:$(git rev-parse --short HEAD)")
          if [ "$VERSION" != "dev" ]; then
            TAGS+=(-t "${IMAGE}:${VERSION}")
          fi
          docker buildx build "${TAGS[@]}" \
            --build-arg VITE_SERVER_CENTRAL_URL="${VITE_SERVER_CENTRAL_URL}" \
            --build-arg VITE_APP_VERSION="${VERSION}" \
            -f Dockerfile --push .

      - name: Deploy ffcom-client
        working-directory: deploy/client
        run: |
          export IMAGE_TAG=$(git rev-parse --short HEAD)
          docker compose -f docker-compose.yml up -d --pull always --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            status=$(docker inspect --format='{{.State.Health.Status}}' ffcom-client 2>/dev/null)
            [ "$status" = "healthy" ] && echo "ffcom-client healthy" && exit 0
            echo "Aguardando... status: ${status:-iniciando} (tentativa $i/12)"
            sleep 10
          done
          echo "Timeout: ffcom-client nao ficou healthy em 2 minutos"
          docker logs --tail 50 ffcom-client
          exit 1

      - name: Limpeza de imagens antigas
        run: docker image prune -f

      - name: Logout do GHCR
        if: always()
        run: docker logout ghcr.io

  # App desktop Windows (ver docs/architecture.md, "Decisão: distribuição e
  # atualização do app desktop"). Runner Windows do GitHub (gratuito em
  # repositório público): o runner próprio é Linux, e o NSIS do
  # electron-builder no Linux exigiria wine. Só em tag.
  desktop-windows:
    name: App desktop Windows
    needs: [security-scan, changelog, locales]
    if: startsWith(github.ref, 'refs/tags/client-v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Versão
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/client-}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build do instalador
        working-directory: client
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          npm ci
          npm run build:electron
          npx electron-builder --win --publish never "--config.extraMetadata.version=${{ steps.version.outputs.number }}"

      # O latest.yml sai com o nome do instalador relativo à URL de
      # build.publish (a release fixa desktop-stable); o instalador em si fica
      # na release da versão, então o índice passa a apontar para ele.
      - name: Apontar o latest.yml para a release da versão
        working-directory: client/release
        env:
          FILE: FFCom-Setup-${{ steps.version.outputs.number }}.exe
          BASE: https://github.com/${{ github.repository }}/releases/download/client-${{ steps.version.outputs.tag }}
        run: |
          sed -i -E "s#^(\s*-?\s*(url|path): )${FILE}\$#\1${BASE}/${FILE}#" latest.yml
          cat latest.yml
          grep -q "url: ${BASE}/${FILE}" latest.yml && grep -q "path: ${BASE}/${FILE}" latest.yml
          cp "${FILE}" FFCom-Setup.exe

      # Descrição da release = entrada da versão no CHANGELOG.md e no
      # CHANGELOG.en.md (português primeiro, inglês embaixo), o mesmo texto
      # da home page (scripts/changelog-notes.sh).
      - name: Notas da versão
        run: bash scripts/changelog-notes.sh "client-${{ steps.version.outputs.tag }}" > "$RUNNER_TEMP/release-notes.md"

      - name: Release da versão
        uses: softprops/action-gh-release@v3
        with:
          tag_name: client-${{ steps.version.outputs.tag }}
          name: FFCom ${{ steps.version.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            client/release/FFCom-Setup-${{ steps.version.outputs.number }}.exe
            client/release/FFCom-Setup-${{ steps.version.outputs.number }}.exe.blockmap
          fail_on_unmatched_files: true
          make_latest: false

      # Release fixa lida pelo app instalado (latest.yml) e pelo botão de
      # download do site (FFCom-Setup.exe, nome estável). Pre-release, como a
      # channel-stable, para nunca virar a "Latest" do repositório. Mesmo
      # mecanismo da channel-stable (deploy-ffcom-channel.yml): sobe com nome
      # temporário e só depois troca, para o download do site não ficar em
      # 404 durante o upload do instalador (~110 MB).
      - name: Índice desktop-stable
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = 'desktop-stable';
            let rel;
            try {
              rel = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (e) {
              if (e.status !== 404) throw e;
              rel = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: 'App desktop: versão atual',
                body: 'Índice (latest.yml) lido pelo app desktop para se atualizar e instalador com nome fixo (FFCom-Setup.exe) para o botão de download do site. Não é uma versão; ver docs/architecture.md, "Decisão: distribuição e atualização do app desktop".',
                prerelease: true, make_latest: 'false',
              })).data;
            }

            const finals = ['latest.yml', 'FFCom-Setup.exe'];
            const suffix = `.new-${context.runId}`;
            const uploaded = {};
            for (const name of finals) {
              const data = fs.readFileSync(`client/release/${name}`);
              const res = await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: rel.id, name: name + suffix, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length },
              });
              uploaded[name] = res.data.id;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: rel.id, per_page: 100 });
            for (const a of assets) {
              const stale = finals.includes(a.name) || (/\.new-\d+$/.test(a.name) && !a.name.endsWith(suffix));
              if (stale) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
            }
            for (const name of finals) {
              await github.rest.repos.updateReleaseAsset({ owner, repo, asset_id: uploaded[name], name });
            }
            core.info(`índice publicado em ${rel.html_url}`);

  # App Android (ver docs/android-runbook.md e docs/architecture.md, "Decisão:
  # app Android com Capacitor (fase 1)"). Em paralelo ao desktop-windows e com
  # o mesmo modelo: APK na release da versão e índice fixo android-stable. A
  # WebView do app carrega o client publicado (capacitor.config.ts), então o
  # dist/ embutido no APK é só o fallback do Capacitor. Só em tag.
  android:
    name: App Android
    needs: [security-scan, changelog, locales]
    if: startsWith(github.ref, 'refs/tags/client-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v4

      # versionCode = X*1000000 + Y*1000 + Z: sempre crescente entre versões,
      # como o Android exige para instalar por cima (Y e Z abaixo de 1000).
      - name: Versão
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/client-}"
          NUMBER="${TAG#v}"
          if ! [[ "$NUMBER" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || [ "${BASH_REMATCH[2]}" -ge 1000 ] || [ "${BASH_REMATCH[3]}" -ge 1000 ]; then
            echo "::error::Tag client-${TAG} fora do formato X.Y.Z (Y e Z abaixo de 1000) que o versionCode do APK exige."
            exit 1
          fi
          CODE=$(( 10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]} ))
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

      # Chave de assinatura do APK (docs/android-runbook.md, "Pré-requisitos
      # manuais"). Sem ela o job falha: um APK assinado com outra chave não
      # instala por cima do que as pessoas já têm.
      - name: Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Faltam os secrets do APK: ${missing[*]}. Ver docs/android-runbook.md, Pré-requisitos manuais, item 1."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ffcom-android.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/ffcom-android.jks" >> "$GITHUB_ENV"

      # As senhas e o alias vão por variável de ambiente para o signingConfigs
      # do android/app/build.gradle, que só assina com ANDROID_KEYSTORE_FILE
      # definido (passo anterior).
      - name: Build do APK
        working-directory: client
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.tag }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm ci
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            "-PffcomVersionName=${{ steps.version.outputs.number }}" \
            "-PffcomVersionCode=${{ steps.version.outputs.code }}"

      # Confere a assinatura e monta os arquivos da release: o APK com a
      # versão no nome, a cópia com nome estável para o site e o latest.json
      # que o app vai consultar (fase 2 do runbook), apontando para o APK da
      # release da versão, como o latest.yml do desktop.
      - name: APK e latest.json
        env:
          NUMBER: ${{ steps.version.outputs.number }}
          CODE: ${{ steps.version.outputs.code }}
          BASE: https://github.com/${{ github.repository }}/releases/download/client-${{ steps.version.outputs.tag }}
        run: |
          APK=client/android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          mkdir -p android-release
          cp "$APK" "android-release/FFCom-${NUMBER}.apk"
          cp "$APK" android-release/FFCom.apk
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          jq -n --arg version "$NUMBER" --argjson versionCode "$CODE" \
            --arg url "${BASE}/FFCom-${NUMBER}.apk" --arg sha256 "$SHA256" \
            '{version: $version, versionCode: $versionCode, url: $url, sha256: $sha256}' > android-release/latest.json
          cat android-release/latest.json

      # Mesmo texto e mesma release do desktop-windows: quem chegar primeiro
      # cria, e o outro só anexa o seu arquivo (a action trata a corrida).
      - name: Notas da versão
        run: bash scripts/changelog-notes.sh "client-${{ steps.version.outputs.tag }}" > "$RUNNER_TEMP/release-notes.md"

      - name: Release da versão
        uses: softprops/action-gh-release@v3
        with:
          tag_name: client-${{ steps.version.outputs.tag }}
          name: FFCom ${{ steps.version.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: android-release/FFCom-${{ steps.version.outputs.number }}.apk
          fail_on_unmatched_files: true
          make_latest: false

      # Release fixa lida pelo app (latest.json) e pelo botão de download do
      # site (FFCom.apk, nome estável). Pre-release, como a desktop-stable, e
      # com a mesma troca por nome temporário para o download não ficar em 404
      # durante o upload.
      - name: Índice android-stable
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = 'android-stable';
            let rel;
            try {
              rel = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (e) {
              if (e.status !== 404) throw e;
              rel = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: 'App Android: versão atual',
                body: 'Índice (latest.json) lido pelo app Android para se atualizar e APK com nome fixo (FFCom.apk) para o botão de download do site. Não é uma versão; ver docs/android-runbook.md e docs/architecture.md, "Decisão: app Android com Capacitor (fase 1)".',
                prerelease: true, make_latest: 'false',
              })).data;
            }

            const finals = ['latest.json', 'FFCom.apk'];
            const suffix = `.new-${context.runId}`;
            const uploaded = {};
            for (const name of finals) {
              const data = fs.readFileSync(`android-release/${name}`);
              const res = await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: rel.id, name: name + suffix, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length },
              });
              uploaded[name] = res.data.id;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: rel.id, per_page: 100 });
            for (const a of assets) {
              const stale = finals.includes(a.name) || (/\.new-\d+$/.test(a.name) && !a.name.endsWith(suffix));
              if (stale) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
            }
            for (const name of finals) {
              await github.rest.repos.updateReleaseAsset({ owner, repo, asset_id: uploaded[name], name });
            }
            core.info(`índice publicado em ${rel.html_url}`);
