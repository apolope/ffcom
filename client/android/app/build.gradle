apply plugin: 'com.android.application'

// Versão do APK: o CI passa -PffcomVersionName=X.Y.Z e
// -PffcomVersionCode=X*1000000+Y*1000+Z a partir da tag client-vX.Y.Z (ver
// .github/workflows/deploy-ffcom-client.yml); o versionCode é sempre
// crescente, como o Android exige para instalar por cima. No build local,
// sem as propriedades, fica 1 / "0.0.0".
def ffcomVersionName = project.findProperty('ffcomVersionName') ?: '0.0.0'
def ffcomVersionCode = (project.findProperty('ffcomVersionCode') ?: '1') as Integer

// Assinatura do release pelas variáveis de ambiente que o CI monta a partir
// dos secrets (nenhuma chave nem senha no repositório). Sem
// ANDROID_KEYSTORE_FILE, o assembleRelease sai sem assinatura, e o debug
// continua com a chave de debug do Android Studio.
def releaseKeystore = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace = "br.com.a3sitsolutions.ffcom"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.a3sitsolutions.ffcom"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ffcomVersionCode
        versionName ffcomVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Push (fase 6): só o FirebaseMessagingService e o token. Sem
    // google-services.json o Firebase não sobe e o push fica desligado (ver
    // o fim deste arquivo e PushPlugin).
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Configuração do Firebase (push, fase 6). O google-services.json é da
// instância e fica fora do git: o CI escreve a partir do secret
// ANDROID_GOOGLE_SERVICES_JSON, e no build local se copia à mão (ver
// client/README.md). Sem o arquivo, o plugin não entra, o build segue e o
// app só fica sem push.
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
