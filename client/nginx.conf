server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota sem arquivo correspondente cai no index.html
    # (necessário para /auth/callback e qualquer rota futura de client-side
    # routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Digital Asset Links do app Android: o Android baixa este arquivo para
    # verificar o App Link /auth/android (e /convite). Precisa sair como
    # application/json, com 200 direto e sem redirect; sem o arquivo, 404 em
    # vez do index.html do fallback de SPA, para a falha ser visível. Ver
    # docs/architecture.md, "Decisão: login do app Android no navegador do
    # sistema (fase 3)".
    location = /.well-known/assetlinks.json {
        default_type application/json;
        types { }
        try_files $uri =404;
    }

    # Aviso de licenças de terceiros gerado no build: sem o charset o
    # navegador lê o texto (com acentos) como Latin-1.
    location = /third-party-licenses.txt {
        charset utf-8;
    }
}
