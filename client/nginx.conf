server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota sem arquivo correspondente cai no index.html
    # (necessário para /auth/callback e qualquer rota futura de client-side
    # routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
