# Compose de implantação do server-channel (instância de teste) em
# SVRUBS24IPS0101 — diferente de server-channel/docker-compose.yml
# (referência genérica para qualquer self-hoster). Este arquivo assume a
# infra da a3s-network: imagem pré-buildada no GHCR e a rede overlay
# a3s-services para o NPM alcançar os endpoints HTTP/WebSocket por nome.
#
# Tráfego que NÃO é HTTP (mídia RTC do LiveKit, STUN/TURN do coturn) não
# passa pelo NPM — os containers publicam essas portas direto no host,
# amarradas ao IP de LAN (10.20.4.10, ver D:\Dev\a3s-network,
# docs/servers/SVRUBS24IPS0101.md), mesmo padrão já usado em
# D:\Dev\a3s-network\deploy\go2rtc\docker-compose.yml. O host já roda outro
# coturn (stack VoIP/FreeSWITCH) — as faixas default abaixo podem colidir;
# ajustar via .env antes do primeiro deploy caso a checagem de portas do
# host acuse conflito.
services:
  db:
    image: postgres:17-alpine
    container_name: ffcom-channel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ffcom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-ffcom_channel}
    volumes:
      - ffcom_channel_db:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ffcom} -d ${POSTGRES_DB:-ffcom_channel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    container_name: ffcom-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: ${LIVEKIT_RTC_PORT_RANGE_START:-50000}
          port_range_end: ${LIVEKIT_RTC_PORT_RANGE_END:-50100}
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY no .env}: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET no .env}
    ports:
      # Fallback TCP + mídia RTC (UDP) — raw, não passa pelo NPM. Amarrado
      # ao IP de LAN do host, não 0.0.0.0 (mesmo padrão do go2rtc).
      - "${HOST_LAN_IP:?defina HOST_LAN_IP (IP de LAN do host) no .env}:7881:7881/tcp"
      - "${HOST_LAN_IP}:${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50100}:${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50100}/udp"
    networks:
      # Só a porta 7880 (sinalização HTTP/WS) precisa ser alcançável pelo
      # NPM por nome — não é publicada no host, só nesta rede.
      - a3s-services

  app:
    image: ghcr.io/apolope/ffcom-channel:${IMAGE_TAG}
    container_name: ffcom-channel-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ffcom}:${POSTGRES_PASSWORD}@ffcom-channel-db:5432/${POSTGRES_DB:-ffcom_channel}?sslmode=disable
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?defina OIDC_ISSUER_URL no .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS no .env}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?defina LIVEKIT_PUBLIC_URL no .env (wss://livekit-test.ffcom.a3sitsolutions.com.br)}
    networks:
      - internal
      - a3s-services
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  coturn:
    image: coturn/coturn:latest
    container_name: ffcom-coturn
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --external-ip=${TURN_EXTERNAL_IP:?defina TURN_EXTERNAL_IP (IP público do host/site) no .env}
      - --realm=${TURN_REALM:-ffcom.local}
      - --use-auth-secret
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET:?defina TURN_STATIC_AUTH_SECRET no .env}
      - --listening-port=3478
      - --min-port=${TURN_RELAY_MIN_PORT:-49160}
      - --max-port=${TURN_RELAY_MAX_PORT:-49200}
      - --no-cli
      - --fingerprint
    ports:
      # Lado esquerdo (host) é o que pode mudar se colidir com o coturn já
      # existente no host (stack VoIP/FreeSWITCH em network_mode=host); o
      # lado direito (container) fica fixo em 3478, que é onde --listening-port
      # de fato coloca o coturn escutando.
      - "${HOST_LAN_IP}:${TURN_LISTEN_PORT:-3478}:3478/tcp"
      - "${HOST_LAN_IP}:${TURN_LISTEN_PORT:-3478}:3478/udp"
      - "${HOST_LAN_IP}:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}/udp"
    # Sem rede a3s-services — coturn não fala HTTP, o NPM não tem por que
    # alcançá-lo.

volumes:
  ffcom_channel_db:

networks:
  internal:
  a3s-services:
    external: true
