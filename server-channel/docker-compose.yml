networks:
  ffcom-channel:

volumes:
  postgres_data:
  attachments_data:
  runtime_data:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ffcom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-ffcom_channel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ffcom-channel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ffcom} -d ${POSTGRES_DB:-ffcom_channel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SFU de voz/vídeo/compartilhamento de tela. Ver docs/architecture.md
  # ("Decisão: SFU de voz/vídeo — LiveKit"). Config injetada via LIVEKIT_CONFIG
  # (variável de ambiente suportada nativamente pelo livekit-server) em vez de
  # arquivo montado, para manter tudo centralizado no .env.
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: ${LIVEKIT_RTC_PORT_RANGE_START:-50000}
          port_range_end: ${LIVEKIT_RTC_PORT_RANGE_END:-50100}
          use_external_ip: true
        # TURN embutido do LiveKit, só UDP (sem certificado): para quem não
        # consegue mandar UDP direto para as portas de mídia. O LiveKit anuncia
        # o TURN no próprio IP público (o mesmo que descobre com
        # use_external_ip) e gera credenciais temporárias sozinho. Substitui o
        # coturn, que não relayava para o próprio --external-ip (o mesmo IP do
        # LiveKit). O relay manda a mídia para esse IP público, então o
        # roteador precisa de NAT loopback (hairpin), que a maioria tem. Ver
        # docs/architecture.md, "Decisão: TURN/TLS na 443".
        turn:
          enabled: true
          udp_port: ${TURN_UDP_PORT:-3478}
        keys:
          ${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY no .env}: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET no .env}
    ports:
      - "7880:7880/tcp" # HTTP/WebSocket (signaling)
      - "7881:7881/tcp" # RTC fallback via TCP
      - "${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50100}:${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50100}/udp" # mídia RTC
      - "${TURN_UDP_PORT:-3478}:${TURN_UDP_PORT:-3478}/udp" # TURN (UDP)
    networks:
      - ffcom-channel

  # App Go do server-channel: API REST + WebSocket de canais de texto e
  # forum, voz via LiveKit, roles/permissões, convites e anexos. Estado item
  # a item em TODO.md, seção "server-channel"; hospedagem e atualizações em
  # README.md.
  #
  # Autenticação: mesma instância central de Authentik usada por
  # server-central, validada localmente sem chamada entre os dois
  # componentes — ver docs/architecture.md, "modelo de dados de
  # server-channel".
  #
  # Container evergreen (ver docs/architecture.md, "Decisão: container
  # evergreen em `server-channel`"): a tag da imagem é a versão do
  # CONTRATO do container (variáveis, portas, volumes), não a do serviço.
  # O lançador ffcom-runtime dentro dela baixa, verifica (índice assinado) e
  # troca o binário server-channel sozinho, conforme as variáveis FFCOM_*
  # abaixo. `:1` acompanha todo o contrato 1.x (patches e minors são
  # compatíveis); só troque de major lendo as notas da versão.
  #
  # Desenvolvimento local (compilar o código do disco em vez de usar a
  # imagem publicada): docker-compose.dev.yml, ver o topo dele.
  app:
    image: ghcr.io/apolope/ffcom-channel:1
    restart: unless-stopped
    # O lançador repassa o SIGTERM ao server-channel, que encerra em até 25s
    # (WebSockets fechados com 1001, requisições em andamento terminam), e
    # espera o filho até 30s. O padrão de 10s do Docker mataria os dois no
    # meio do shutdown.
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ffcom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ffcom_channel}?sslmode=disable
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?defina OIDC_ISSUER_URL no .env (https://auth.ffcom.a3sitsolutions.com.br/application/o/ffcom/)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Exige X-Forwarded-Proto: https quando ligado — ver README.md, "TLS /
      # HTTPS". Padrão desligado (vazio), para não quebrar dev local sem
      # proxy na frente.
      REQUIRE_TLS: ${REQUIRE_TLS:-}
      # Rate limiting — ver docs/architecture.md, "Decisão: rate limiting em
      # server-channel".
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-}
      RATE_LIMIT_WS_RPM: ${RATE_LIMIT_WS_RPM:-}
      RATE_LIMIT_WS_BURST: ${RATE_LIMIT_WS_BURST:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Endereço público que o client usa para se conectar ao LiveKit
      # diretamente (sinalização + mídia) — não passa pelo server-channel.
      # Ver docs/architecture.md, "Decisão: integração de voz com LiveKit".
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?defina LIVEKIT_PUBLIC_URL no .env}
      # API do LiveKit por dentro da rede do compose, usada para listar quem
      # está em cada sala de voz (GET /api/voice/participants).
      LIVEKIT_API_URL: http://livekit:7880
      # Upload de anexo/imagem em mensagem — ver docs/architecture.md,
      # "Decisão: upload de anexo em mensagem". ATTACHMENTS_DIR precisa
      # apontar para um volume (attachments_data abaixo), ou anexos somem a
      # cada recriação do container.
      ATTACHMENTS_DIR: /data/attachments
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-}
      # Política de atualização do lançador ffcom-runtime (todas opcionais):
      # - FFCOM_CHANNEL_VERSION: trilha. Vazio (padrão) = o minor do binário
      #   semente da imagem, ou seja, só patches automáticos (ex. 0.7.x);
      #   "X.Y" = só patches desse minor; "X.Y.Z" = fixa nessa versão;
      #   "latest" = qualquer versão nova, inclusive minor.
      # - FFCOM_AUTO_UPDATE: true (padrão) ou false (só loga que há versão
      #   nova, não troca).
      # - FFCOM_UPDATE_INTERVAL: intervalo entre checagens (padrão 1h, mínimo
      #   1m), com até 25% de variação aleatória. `docker compose kill -s HUP
      #   app` força a checagem na hora.
      FFCOM_CHANNEL_VERSION: ${FFCOM_CHANNEL_VERSION:-}
      FFCOM_AUTO_UPDATE: ${FFCOM_AUTO_UPDATE:-}
      FFCOM_UPDATE_INTERVAL: ${FFCOM_UPDATE_INTERVAL:-}
    ports:
      - "${SERVER_CHANNEL_PORT:-8080}:8080"
    volumes:
      - attachments_data:/data/attachments
      # Binários baixados pelo lançador (versions/<versão>/, current, bad).
      # Sem volume, cada recriação do container volta para a semente da
      # imagem e baixa tudo de novo.
      - runtime_data:/data/runtime
    networks:
      - ffcom-channel
