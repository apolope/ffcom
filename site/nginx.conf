# Cache do CHANGELOG.md e do CHANGELOG.en.md buscados no GitHub (ver
# location /changelog.md), uma chave por arquivo.
proxy_cache_path /var/cache/nginx/changelog levels=1 keys_zone=changelog:1m max_size=5m inactive=7d use_temp_path=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O NPM entrega www.ffcom... e ffcom... para este mesmo container; o
    # endereço canônico é o apex, então www redireciona para ele.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Histórico de versões: a fonte é o CHANGELOG.md do main no GitHub, com a
    # tradução em inglês no CHANGELOG.en.md (/changelog.en.md, mesmo esquema).
    # O nginx busca do lado do servidor (o navegador de quem visita nunca fala
    # com o GitHub) e guarda por 5 minutos, então uma entrada nova aparece no
    # site sem reimplantar. Se o GitHub não responder, serve a cópia do
    # cache, e na falta dela a cópia embutida na imagem no build.
    # Este arquivo é um template da imagem oficial do nginx: no boot ela
    # troca NGINX_LOCAL_RESOLVERS pelos DNS do /etc/resolv.conf do container
    # (127.0.0.11 na rede a3s-services, o DNS do host fora dela) e deixa as
    # variáveis do próprio nginx intactas. Com variável no proxy_pass o nome
    # só é resolvido na requisição, então um DNS fora do ar não impede o
    # nginx de subir.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
    resolver_timeout 5s;

    location = /changelog.md {
        set $changelog_upstream https://raw.githubusercontent.com/apolope/ffcom/main/CHANGELOG.md;
        proxy_pass $changelog_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_cache changelog;
        proxy_cache_key changelog;
        proxy_cache_valid 200 5m;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        proxy_intercept_errors on;
        error_page 403 404 429 500 502 503 504 = @changelog_local;

        add_header X-Changelog-Source "github ($upstream_cache_status)" always;
        add_header Cache-Control "public, max-age=60" always;
    }

    location @changelog_local {
        default_type "text/plain; charset=utf-8";
        add_header X-Changelog-Source "local" always;
        try_files /changelog-local.md =404;
    }

    # Tradução em inglês do histórico (CHANGELOG.en.md), igual ao de cima:
    # mesmo cache com chave própria e cópia embutida no build como reserva.
    location = /changelog.en.md {
        set $changelog_en_upstream https://raw.githubusercontent.com/apolope/ffcom/main/CHANGELOG.en.md;
        proxy_pass $changelog_en_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_cache changelog;
        proxy_cache_key changelog-en;
        proxy_cache_valid 200 5m;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        proxy_intercept_errors on;
        error_page 403 404 429 500 502 503 504 = @changelog_local_en;

        add_header X-Changelog-Source "github ($upstream_cache_status)" always;
        add_header Cache-Control "public, max-age=60" always;
    }

    location @changelog_local_en {
        default_type "text/plain; charset=utf-8";
        add_header X-Changelog-Source "local" always;
        try_files /changelog-local.en.md =404;
    }
}
